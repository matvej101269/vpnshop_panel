services:
  vpnshop:
    build: .
    env_file: .env
    environment:
      CONTROL_API_URL: http://vpnshop-control:8765
      CONTROL_API_TOKEN: ${CONTROL_TOKEN:-}
    restart: unless-stopped
    volumes:
      - vpnshop-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
  vpnshop-control:
    build: ./ops-control
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}
      PROJECT_DIR: /opt/vpnshop
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/vpnshop
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped
volumes:
  vpnshop-data:
