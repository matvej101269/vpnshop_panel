<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{csrf_token}}"><title>VPN Panel · {{ section }}</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--side:#171d26;--panel:#1b222d;--line:#2b3441;--text:#e5eaf1;--muted:#8995a5;--blue:#3b82f6;--green:#35b779;--red:#e56b6f;--amber:#dfac55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}aside{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 22px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.04em}.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(145deg,#428cf7,#2359b8);display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:0;margin-top:3px}.nav-label{color:#697585;font-size:10px;font-weight:700;letter-spacing:.12em;padding:22px 10px 8px}.nav a{display:flex;align-items:center;gap:11px;padding:10px;border-radius:6px;color:#aab4c1;text-decoration:none;margin:2px 0}.nav a:hover,.nav a.active{background:#252f3d;color:#fff}.nav a.active{box-shadow:inset 2px 0 var(--blue)}.ico{width:17px;text-align:center;color:#8ca0b8}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px;color:var(--muted);font-size:12px}.main{min-width:0}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#141a22}.crumb{color:var(--muted)}.admin-chip{border:1px solid var(--line);border-radius:5px;padding:7px 10px;color:#b5c0cd;font-size:12px}.content{padding:25px 28px;max-width:1600px;margin:auto}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title-row h1{font-size:22px;margin:0 0 5px;font-weight:600}.subtitle{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:16px 18px}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:24px;font-weight:600;margin-top:8px}.grid-two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin:14px 0;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}.section-head h2{font-size:14px;font-weight:600;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8290a1;font-size:11px;font-weight:600;background:#19202a;padding:11px 13px;cursor:pointer}td{padding:10px 13px;border-top:1px solid #27303b;color:#d4dbe4;font-size:12px}tr:hover td{background:#202834}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 8px;font-size:11px;background:#183629;color:#69d49e}.pill.off{background:#392529;color:#f09295}.pill.warn{background:#3d3421;color:#efc36e}.dot{width:6px;height:6px;background:currentColor;border-radius:50%}.toolbar{display:flex;gap:8px;align-items:center}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr .7fr 1.1fr auto;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}input,textarea,select{min-width:0;background:#121821;color:var(--text);border:1px solid #384352;border-radius:5px;padding:9px 10px;font:inherit;font-size:12px}textarea{width:100%;min-height:120px;resize:vertical}input:focus,textarea:focus,select:focus{outline:1px solid var(--blue);border-color:var(--blue)}button,.button{border:1px solid #4388f6;background:#2f72d6;color:white;padding:8px 12px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{background:#3d82eb}.btn-quiet{border-color:#414c5a;background:#252e39;color:#d2dae4;padding:5px 9px}.btn-danger{border-color:#84454a;background:#42262a;color:#f2a0a3}.empty{text-align:center;color:var(--muted);padding:25px}.form-row{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.form-row label{color:#bac4d0;font-size:12px}.hint{font-size:11px;color:var(--muted);margin-top:5px}.form-panel{padding:16px 18px}.secret{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;align-items:center}.secret input[type=password]{width:100%}.secret-status{font-size:11px;color:var(--muted)}.secret-status.ok{color:#69d49e}.actions{display:flex;gap:7px;align-items:center}.check{accent-color:var(--blue)}.mini{font-size:11px;color:var(--muted)}.bars{display:flex;align-items:end;gap:10px;height:140px;padding:16px 8px 0}.bar-group{height:100%;display:flex;flex:1;align-items:end;justify-content:center;gap:3px;position:relative}.bar{width:13px;min-height:2px;border-radius:3px 3px 0 0;background:#4086ed}.bar.out{background:#d86b72}.bar-label{position:absolute;bottom:-20px;font-size:10px;color:var(--muted)}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin:26px 0 0}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:#4086ed}.legend .out i{background:#d86b72}.pop-row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr 35px;gap:10px;align-items:center;margin:15px 0;font-size:12px}.pop-track{height:7px;background:#111720;border-radius:9px;overflow:hidden}.pop-fill{height:100%;background:#3b82f6;border-radius:9px}footer{padding:18px 2px;color:#697585;font-size:11px}.plan-edit{display:grid;grid-template-columns:1.4fr .7fr .7fr .6fr .7fr auto auto;gap:6px;align-items:center}.plan-edit input{width:100%}.user-edit{display:flex;gap:5px;align-items:center}.user-edit input{width:90px}.secret-summary{color:#b9c5d3;font-size:12px}.grid-settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.break{overflow-wrap:anywhere}
@media(max-width:1050px){.layout{grid-template-columns:64px minmax(0,1fr)}aside{padding:14px 8px}.brand{padding:0 7px 15px}.brand-text,.nav-label,.nav a span:not(.ico),.side-foot{display:none}.nav a{justify-content:center;padding:12px 0}.ico{font-size:17px}.content{padding:18px 14px}.top{padding:0 14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-two,.grid-settings{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(3,1fr)}.plan-edit{min-width:800px}.form-row{grid-template-columns:130px 1fr}.secret{grid-template-columns:1fr 1.5fr}.secret-status{grid-column:1/-1}}
@media(max-width:550px){.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.metric{font-size:20px}.content{padding:13px 9px}.form-grid{grid-template-columns:1fr 1fr}.form-grid input:first-child{grid-column:span 2}.form-row{display:block}.form-row label{display:block;margin-bottom:7px}.secret{grid-template-columns:1fr}.secret-status{grid-column:auto}.title-row h1{font-size:19px}}
</style></head>
<body><div class="layout"><aside>
<div class="brand"><div class="logo">V</div><div class="brand-text">VPN PANEL<small>subscription manager</small></div></div>
<div class="nav-label">УПРАВЛЕНИЕ</div><nav class="nav">
<a class="{{ 'active' if section=='overview' else '' }}" href="/admin/overview"><span class="ico">▦</span><span>Обзор</span></a>
<a class="{{ 'active' if section=='users' else '' }}" href="/admin/users"><span class="ico">◉</span><span>Пользователи</span></a>
<a class="{{ 'active' if section=='subscriptions' else '' }}" href="/admin/subscriptions"><span class="ico">◇</span><span>Подписки и тарифы</span></a>
<a class="{{ 'active' if section=='addons' else '' }}" href="/admin/addons"><span class="ico">＋</span><span>Дополнительные пакеты</span></a>
<a class="{{ 'active' if section=='history' else '' }}" href="/admin/history"><span class="ico">◷</span><span>История подписок</span></a>
<a class="{{ 'active' if section=='botmenu' else '' }}" href="/admin/botmenu"><span class="ico">☷</span><span>Конструктор бота</span></a>
<a class="{{ 'active' if section=='settings' else '' }}" href="/admin/settings"><span class="ico">⚙</span><span>Настройки</span></a>
</nav><div class="side-foot">VPN service · Admin</div></aside>
<main class="main"><header class="top"><div class="crumb">VPN Panel <span class="muted">/ {{ section }}</span></div><div class="admin-chip">● &nbsp;Администратор</div></header>
<div class="content">{% include section_body %}<footer>VPN service · панель управления</footer></div></main></div>
<script>
document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const table=th.closest('table'),idx=[...th.parentElement.children].indexOf(th),body=table.tBodies[0],rows=[...body.rows],asc=th.dataset.order!=='asc';rows.sort((a,b)=>{const x=a.cells[idx]?.dataset.sort??a.cells[idx]?.innerText??'',y=b.cells[idx]?.dataset.sort??b.cells[idx]?.innerText??'';const nx=Number(x),ny=Number(y);return (Number.isNaN(nx)?x.localeCompare(y,'ru'):nx-ny)*(asc?1:-1)});rows.forEach(r=>body.appendChild(r));th.dataset.order=asc?'asc':'desc'}));
document.querySelectorAll('[data-select-all]').forEach(c=>c.addEventListener('change',()=>document.querySelectorAll('.user-select').forEach(x=>x.checked=c.checked)));
const csrfValue=document.querySelector('meta[name="csrf-token"]').content;document.querySelectorAll('form[method="post"]').forEach(f=>{const i=document.createElement('input');i.type='hidden';i.name='csrf_token';i.value=csrfValue;f.appendChild(i)});
document.querySelectorAll('.reveal-secret').forEach(button=>button.addEventListener('click',async()=>{const input=button.parentElement.querySelector('[data-secret-key]');if(!input)return;if(input.type==='text'){input.type='password';button.textContent='◉';return}if(!input.value&&input.dataset.loaded!=='true'){button.disabled=true;try{const r=await fetch('/admin/api/secrets/'+encodeURIComponent(input.dataset.secretKey));if(!r.ok)throw new Error();const data=await r.json();input.value=data.value||'';input.dataset.loaded='true'}catch{button.title='Не удалось получить секрет'}finally{button.disabled=false}}input.type='text';button.textContent='◎'}));
</script></body></html>
