<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · VPN Shop</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#1b222d;--line:#2b3441;--text:#e5eaf1;--muted:#8995a5;--blue:#3b82f6;--red:#f09295}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#1a2940 0,transparent 42%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}.login{width:min(410px,calc(100vw - 32px));padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 18px 60px #0005}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(145deg,#428cf7,#2359b8);font-weight:700}.brand strong{display:block;font-size:15px;letter-spacing:.04em}.brand small{display:block;margin-top:4px;color:var(--muted)}h1{margin:0 0 7px;font-size:21px;font-weight:600}.subtitle{margin:0 0 23px;color:var(--muted);font-size:12px}label{display:block;margin:15px 0 7px;color:#bac4d0;font-size:12px}input{width:100%;padding:11px 12px;background:#121821;color:var(--text);border:1px solid #384352;border-radius:5px;font:inherit;font-size:13px}input:focus{outline:1px solid var(--blue);border-color:var(--blue)}button{width:100%;margin-top:21px;padding:10px;border:1px solid #4388f6;border-radius:5px;background:#2f72d6;color:white;font:inherit;cursor:pointer}button:hover{background:#3d82eb}.error{padding:10px 12px;border:1px solid #6a3b41;border-radius:5px;background:#392529;color:var(--red);font-size:12px}
</style>
</head>
<body><main class="login">
<div class="brand"><div class="logo">V</div><div><strong>VPN SHOP</strong><small>Панель управления</small></div></div>
<h1>Вход в панель</h1><p class="subtitle">Введите учётные данные администратора</p>
{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}
<form method="post" action="/login" autocomplete="on">
<label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus>
<label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Войти</button>
</form></main></body></html>
